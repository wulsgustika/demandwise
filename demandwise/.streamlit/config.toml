[theme]
base = "light"
primaryColor = "#1D5FE0"
backgroundColor = "#F4F7FC"
secondaryBackgroundColor = "#E6EEFB"
textColor = "#0B1F44"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#0B2A5B"
